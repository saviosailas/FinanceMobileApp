name: Build Skip Lite Android APK

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Skip
        uses: skiptools/actions/setup-skip@v1
        with:
          run-doctor: "true"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0"

      - name: Build Android release APK
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          skip export \
            --release \
            --android \
            --no-ios \
            --no-ios-sim \
            --no-export-project \
            --no-validate-export \
            --arch aarch64 \
            -d ./artifacts

      - name: Collect Skip export logs
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== /tmp contents ==="
          ls -la /tmp || true
          for f in /tmp/skip-export-*.txt; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              sed -n '1,250p' "$f" || true
            fi
          done

      - name: Find APK files
        run: find ./artifacts -type f -name "*.apk" -print

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: skip-lite-android-release
          path: artifacts/**/*.apk
          if-no-files-found: error
          retention-days: 14
